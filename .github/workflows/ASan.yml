# Address Sanitizer: Replicate CRAN's gcc-ASAN 'Additional Test'
# Uses the r-hub gcc-asan container (R-devel built with ASAN/UBSAN).
# Additional_repositories in DESCRIPTION (https://ms609.github.io/packages/) is
# read automatically by ms609/actions/asan, so TreeDistData needs no extra input.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**asan**'
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'
  pull_request:
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'

name: gcc-ASAN

jobs:
  mem-check:
    # The r-hub gcc-asan image has no arm64 variant: stay on x86.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/r-hub/containers/gcc-asan:latest

    name: AddressSanitizer ${{ matrix.config.test }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {test: 'tests'}
          - {test: 'examples'}
          - {test: 'vignettes'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # TreeDistData is not on CRAN. The action's pak::pkg_install() of the
      # vignettes leg's Suggests does not see Additional_repositories (the
      # action sets options(repos) in a separate R process), so the solve fails
      # with "Can't find package called TreeDistData". Install it from GitHub
      # here and exclude it below. The r-hub container ships R + pak, so this
      # runs without a prior checkout.
      - name: Pre-install TreeDistData
        if: matrix.config.test == 'vignettes'
        run: Rscript -e 'pak::pak("ms609/TreeDistData")'
        shell: bash

      - uses: ms609/actions/asan@main
        with:
          test: ${{ matrix.config.test }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Rogue hard-imports Rfast, a ~30-min source build under ASAN that
          # adds no coverage to TreeDist's own compiled code. Its only use (the
          # compare-treesets vignette) is requireNamespace()-guarded.
          exclude-packages: Rogue,TreeDistData
