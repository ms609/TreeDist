# Address Sanitizer: Replicate CRAN's gcc-ASAN 'Additional Test'
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**asan**'
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'
  pull_request:
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'

name: gcc-ASAN

jobs:
  mem-check:
    runs-on: ubuntu-24.04 # Update RSPM when increasing
    container:
      image: rocker/r-devel-san

    name: AddressSanitizer ${{ matrix.config.test }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {test: 'tests'}
          - {test: 'examples'}
          - {test: 'vignettes'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      USING_ASAN: true
      STRINGI_DISABLE_PKG_CONFIG: true
      BIOCONDUCTOR_USE_CONTAINER_REPOSITORY: FALSE # For stringi
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ASAN_OPTIONS: detect_container_overflow=1:verify_asan_link_order=0

    steps:
      - uses: actions/checkout@v6
      
      - name: Install R package dependencies
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org", ms609 = "https://ms609.github.io/packages/"))' \
                  -e 'install.packages(c("remotes", "testthat"))' \
                  -e 'remotes::install_github("ms609/TreeDistData")' \
                  -e 'remotes::install_deps(dependencies = TRUE)' \
                  -e 'remotes::install_local()'

      - name: Install package
        run: |
          cd ..
          R CMD build --no-build-vignettes --no-manual --no-resave-data TreeDist
          R CMD INSTALL TreeDist*.tar.gz
          cd TreeDist

      - name: ASAN - memcheck ${{ matrix.config.test }}
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=16
          Rscript memcheck/${{ matrix.config.test }}.R
