# Address Sanitizer: Replicate CRAN's gcc-ASAN 'Additional Test'
# Uses the r-hub gcc-asan container (R-devel built with ASAN/UBSAN).
# Additional_repositories in DESCRIPTION (https://ms609.github.io/packages/) is
# read automatically by ms609/actions/asan, so TreeDistData needs no extra input.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**asan**'
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'
  pull_request:
    paths:
      - '.github/workflows/ASan.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.Rmd'

name: gcc-ASAN

permissions:
  contents: read

jobs:
  mem-check:
    # The r-hub gcc-asan image has no arm64 variant: stay on x86.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/r-hub/containers/gcc-asan:latest

    name: AddressSanitizer ${{ matrix.config.test }}

    # Each leg runs for up to an hour: a superseding push cancels the stale one.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.config.test }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - {test: 'tests'}
          - {test: 'examples'}
          - {test: 'vignettes'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # r-hub's fedora-44 binaries (ape, mvtnorm, ...) were built against an
      # R using OpenBLAS and R's own LAPACK, so link libopenblasp.so.0 and
      # libRlapack.so.  The current gcc-asan image's R uses FlexiBLAS and has
      # neither, so those packages fail to load.  Install OpenBLAS, and point
      # libRlapack.so at the LAPACK that R itself uses: it exports the same
      # Fortran symbols.
      - name: Provide libopenblasp.so and libRlapack.so
        shell: bash
        run: |
          if ! ldconfig -p | grep -q 'libopenblasp\.so\.0'; then
            dnf install -y openblas-threads
          fi
          rlib="$(Rscript -e 'cat(R.home("lib"))')"
          if [ -e "$rlib/libRlapack.so" ]; then
            echo "libRlapack.so present; nothing to do"
            exit 0
          fi
          flags="$(R CMD config LAPACK_LIBS) $(R CMD config BLAS_LIBS)"
          echo "R links LAPACK with: $flags"
          libs="$(echo "$flags" | grep -o -- '-l[A-Za-z0-9_]*' | sed 's/^-l//' |
                  grep -E 'lapack|flexiblas|openblas|blis|mkl')"
          for name in $libs flexiblas openblas lapack; do
            target="$(ldconfig -p | awk -v l="lib${name}.so" '$1 ~ "^"l {print $NF; exit}')"
            if [ -n "$target" ]; then
              ln -s "$target" "$rlib/libRlapack.so"
              echo "Linked $rlib/libRlapack.so -> $target"
              exit 0
            fi
          done
          echo "::error::No LAPACK library found to stand in for libRlapack.so"
          exit 1

      - uses: ms609/actions/asan@main
        with:
          test: ${{ matrix.config.test }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Rogue hard-imports Rfast, a ~30-min source build under ASAN that
          # adds no coverage to TreeDist's own compiled code. Its only use (the
          # compare-treesets vignette) is requireNamespace()-guarded.
          exclude-packages: Rogue
